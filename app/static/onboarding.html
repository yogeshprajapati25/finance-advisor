<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete your profile — Finance Advisor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <h1>A couple more details.</h1>
      <p>This helps shape your allocation — how it weighs equity vs. safer instruments, and whether to flag your emergency fund first.</p>
    </div>
    <div class="auth-form-side">
      <div class="auth-form">
        <h2>Complete your profile</h2>
        <div class="sub">Takes 20 seconds. You can update this later.</div>
        <div class="error" id="error"></div>
        <label>Age</label>
        <input id="age" type="number">
        <label>Dependents</label>
        <input id="dependents" type="number" value="0">
        <label>Emergency fund</label>
        <select id="emergency">
          <option value="true">I have one (6 months' expenses)</option>
          <option value="false">Not yet</option>
        </select>
        <button id="btn" onclick="saveProfile()">Continue to dashboard</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/static/login.html';

    async function saveProfile() {
      const btn = document.getElementById('btn');
      const errorEl = document.getElementById('error');
      errorEl.innerText = '';
      btn.disabled = true;
      btn.innerText = 'Saving...';

      const body = {
        age: parseInt(document.getElementById('age').value),
        dependents: parseInt(document.getElementById('dependents').value),
        has_emergency_fund: document.getElementById('emergency').value === 'true'
      };
      try {
        const res = await fetch('/profile', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || 'Could not save profile');
        }
        window.location.href = '/static/dashboard.html';
      } catch (e) {
        errorEl.innerText = e.message;
        btn.disabled = false;
        btn.innerText = 'Continue to dashboard';
      }
    }
  </script>
</body>
</html>
