<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Finance Advisor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <h1>Your money, sorted by the numbers.</h1>
    </div>
    <div class="auth-form-side">
      <div class="auth-form">
        <h2>Create your account</h2>
        <div class="sub">Just the basics.</div>
        <div class="error" id="error"></div>
        <label>Email</label>
        <input id="email" type="email">
        <label>Password</label>
        <input id="password" type="password">
        <button id="btn" onclick="signup()">Create account</button>
        <div class="link">Already have an account? <a href="/login">Log in</a></div>
      </div>
    </div>
  </div>

  <script>
    async function signup() {
      const btn = document.getElementById('btn');
      const errorEl = document.getElementById('error');
      errorEl.innerText = '';
      btn.disabled = true;
      btn.innerText = 'Creating account...';

      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };
      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Signup failed');
        localStorage.setItem('token', data.access_token);
        window.location.href = '/dashboard';
      } catch (e) {
        errorEl.innerText = e.message;
        btn.disabled = false;
        btn.innerText = 'Create account';
      }
    }
  </script>
</body>
</html>
